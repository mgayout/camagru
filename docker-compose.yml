services:
  web:
    build: .
    container_name: camagru
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: camagru-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: camagru
      MARIADB_USER: camagru
      MARIADB_PASSWORD: camagru
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  db_data: